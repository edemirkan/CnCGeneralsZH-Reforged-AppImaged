name: Rebase main onto upstream

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-rebase-main
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase and push main
        run: |
          git remote add upstream https://github.com/olcayseygan/CnCGeneralsZH-Reforged.git
          git fetch origin main
          git fetch upstream main
          git switch --force-create main origin/main
          git rebase upstream/main
          git push --force-with-lease origin main
